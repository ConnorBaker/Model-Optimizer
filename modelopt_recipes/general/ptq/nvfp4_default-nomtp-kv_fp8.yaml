# Composed PTQ recipe for dynamic NVFP4 W4A4 with FP8 KV-cache, with the multi-token
# prediction (MTP) head EXCLUDED from quantization.
#
# Identical to `nvfp4_default-kv_fp8` except for the trailing `*mtp*` disable rule.
# The generic recipe's `*weight_quantizer` / `*input_quantizer` globs also match the
# MTP head, which on Megatron-Core Qwen3.5 appears as
# `language_model.mtp.layers.0.eh_proj` plus the inner
# `language_model.mtp.layers.0.mtp_model_layer.{self_attention,mlp}.*` -- 18 quantizers
# in total on Qwen3.5-9B. NVIDIA's reference Qwen3.5 recipe leaves the MTP head in BF16:
# it is small, it is only used for speculative decoding, and quantizing it costs draft
# acceptance rate for almost no memory saving.
#
# The rule must come last: later entries override earlier ones.

imports:
  base_disable_all: configs/ptq/units/base_disable_all
  default_disabled_quantizers: configs/ptq/units/default_disabled_quantizers
  w4a4_nvfp4_nvfp4: configs/ptq/units/w4a4_nvfp4_nvfp4
  kv_fp8: configs/ptq/units/kv_fp8

metadata:
  recipe_type: ptq
  description: >-
    Composes dynamic NVFP4 W4A4 model quantization with FP8 KV-cache quantization for PTQ,
    QAT, and QAD, excluding the MTP head; uses max calibration.
quantize:
  algorithm: max
  quant_cfg:
    - $import: base_disable_all
    - $import: w4a4_nvfp4_nvfp4
    - $import: kv_fp8
    - $import: default_disabled_quantizers
    # Keep the multi-token-prediction head in BF16.
    - quantizer_name: '*mtp*'
      enable: false
