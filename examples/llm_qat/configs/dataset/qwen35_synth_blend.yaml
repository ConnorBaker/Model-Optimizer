# Qwen3.5-9B QAD datablend over the 2026-09-15 synthetic-generation snapshot.
#
# Source: shiychen's snapshot (454,645 conversations / 19.6 GB) generated by the released
# unquantized Qwen/Qwen3.5-9B, relayed to JHB Lustre at
#   /lustre/fsw/portfolios/coreai/users/rohjoshi/qwen35_qad_synth/snapshot-20260915T1847Z
# Two clusters kept separate upstream to preserve sampling provenance; both are globbed
# per category below so the mix is by dataset, not by which cluster produced it.
#
# Records are {"conversation_id", "conversations", "dataset", "thinking", "source"}:
#   - chat_key MUST be `conversations` (not the default `messages`)
#   - `content` is PLAIN TEXT, so chat_pretemplated stays false -- unlike nano35_blend.yaml,
#     whose sources carry pre-rendered ChatML markup
#   - thinking-mode rows carry `reasoning_content`; the Qwen3.5 chat template renders it as
#     a <think> block, non-thinking rows render the canonical empty <think></think>.
#     Both are labeled by the ChatML assistant mask -- no special handling needed.
#
# EXCLUDED: `aalcr` (24 convs) and `ruler` (492 convs). Their median length is 130k-180k
# tokens, so at max_length=8192 the assistant turn falls past the window, every label is
# IGNORE_INDEX, and the loader drops them anyway. Together 0.11% of the corpus.
# `toolcall_schema` is excluded too -- all 5 of its files are 0 bytes.
#
# Ratios are the snapshot's own conversation counts (verification.json), so the blend
# reproduces the natural corpus proportions. The upstream 75/25 thinking mix is listed as
# unreconciled in the README, but the realized ratio is already 74.0/26.0.
#
# blend_size matches nano35_blend.yaml's budget (train_samples=1600 / eval_samples=50 in
# slurm_qwen35_qad/qad_full.sh) with headroom. Raising it later changes the cache key.

blend_size: 4000
splits:
  train: 0.90
  eval: 0.05
  test: 0.05

sources:
  - hf_path: json
    split: train
    ratio: 128643
    chat_key: conversations
    category: ultra_sft_a
    dataset_kwargs:
      data_files:
        - /lustre/fsw/portfolios/coreai/users/rohjoshi/qwen35_qad_synth/snapshot-20260915T1847Z/cmh/wave-*.ultra_sft_a.jsonl
        - /lustre/fsw/portfolios/coreai/users/rohjoshi/qwen35_qad_synth/snapshot-20260915T1847Z/lyris/ultra_sft_a.*.jsonl

  - hf_path: json
    split: train
    ratio: 125982
    chat_key: conversations
    category: ultra_sft_b
    dataset_kwargs:
      data_files:
        - /lustre/fsw/portfolios/coreai/users/rohjoshi/qwen35_qad_synth/snapshot-20260915T1847Z/cmh/wave-*.ultra_sft_b.jsonl
        - /lustre/fsw/portfolios/coreai/users/rohjoshi/qwen35_qad_synth/snapshot-20260915T1847Z/lyris/ultra_sft_b.*.jsonl

  - hf_path: json
    split: train
    ratio: 122140
    chat_key: conversations
    category: ultra_stem_mcqa
    dataset_kwargs:
      data_files:
        - /lustre/fsw/portfolios/coreai/users/rohjoshi/qwen35_qad_synth/snapshot-20260915T1847Z/cmh/wave-*.ultra_stem_mcqa.jsonl
        - /lustre/fsw/portfolios/coreai/users/rohjoshi/qwen35_qad_synth/snapshot-20260915T1847Z/lyris/ultra_stem_mcqa.*.jsonl

  - hf_path: json
    split: train
    ratio: 39175
    chat_key: conversations
    category: instruction_following
    dataset_kwargs:
      data_files:
        - /lustre/fsw/portfolios/coreai/users/rohjoshi/qwen35_qad_synth/snapshot-20260915T1847Z/cmh/wave-*.instruction_following.jsonl
        - /lustre/fsw/portfolios/coreai/users/rohjoshi/qwen35_qad_synth/snapshot-20260915T1847Z/lyris/instruction_following.*.jsonl

  - hf_path: json
    split: train
    ratio: 20345
    chat_key: conversations
    category: ultra_structured_outputs_v3
