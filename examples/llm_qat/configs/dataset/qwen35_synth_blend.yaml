      data_files:
        - /lustre/fsw/portfolios/coreai/users/rohjoshi/qwen35_qad_synth/snapshot-20260915T1847Z/cmh/wave-*.ultra_structured_outputs_v3.jsonl
        - /lustre/fsw/portfolios/coreai/users/rohjoshi/qwen35_qad_synth/snapshot-20260915T1847Z/lyris/ultra_structured_outputs_v3.*.jsonl

  - hf_path: json
    split: train
    ratio: 9116
    chat_key: conversations
    category: ds3_citation
    dataset_kwargs:
      data_files:
        - /lustre/fsw/portfolios/coreai/users/rohjoshi/qwen35_qad_synth/snapshot-20260915T1847Z/cmh/wave-*.ds3_citation.jsonl

