  loss_equivalence_to_current_main_verified: false
  notes:
    - The original distillation entrypoint was experiment-local; its full source and runtime patches are not packaged here.
    - Current main documents a residual probability bucket for top-k KL. A CLI rename alone does not establish loss equivalence.
    - Transformer Engine 2.17.1 required an experiment-local SM103 FlashAttention eligibility fix for head dimension 256.
    - The historical runtime also bounded Adam tensor batches. Validate attention selection, checkpoint restoration, and optimizer behavior before rerunning.
