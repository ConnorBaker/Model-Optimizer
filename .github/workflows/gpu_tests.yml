name: GPU tests

on:
  push:
    branches: ["pull-request/[0-9]+"]
    # NOTE: paths cannot be used since push happens to copied PR and only latest commit to PR is used
  # The merge queue re-runs the required checks on the PR merged with the target branch
  merge_group:
    types: [checks_requested]
    branches: [main, release/*, feature/*]
  schedule:
    - cron: "0 0 * * *" # Nightly
  workflow_dispatch:
    # On-demand

concurrency:
  # Cancel previous runs if new commit is pushed to the same PR
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/heads/pull-request/') && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  pr-gate:
    uses: ./.github/workflows/_pr_gate.yml
    permissions:
      checks: read
    secrets: inherit
    with:
      files: |
        .github/actions/**
        .github/workflows/_gpu_tests_runner.yml
        .github/workflows/_pr_gate.yml
        .github/workflows/gpu_tests.yml
        modelopt/**
        modelopt_recipes/**
        noxfile.py
        pyproject.toml
        tests/_test_utils/**
        tests/conftest.py
        tests/gpu/**
        tests/gpu_megatron/**
        tests/gpu_trtllm/**
        tests/gpu_vllm/**

  # The `gpu` lane (tests/gpu) runs on every change. The lanes that integrate with Megatron-Core,
  # TensorRT-LLM and vLLM run in the merge queue, on nightly and on-demand runs, and on a PR that
  # carries the `run-integration-tests` label: the gate says which (`run_integration`).
  gpu-tests:
    needs: [pr-gate]
    if: needs.pr-gate.outputs.any_changed == 'true'
    uses: ./.github/workflows/_gpu_tests_runner.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      example: gpu
      timeout_minutes: 60
      container_image: nvcr.io/nvidia/pytorch:26.07-py3
      runner: >-
        ${{ (startsWith(github.ref, 'refs/heads/pull-request/') || github.event_name == 'merge_group') &&
        'linux-amd64-gpu-rtxpro6000-latest-1' || 'linux-amd64-gpu-rtxpro6000-latest-2' }}

  # Lanes that integrate with other frameworks
  gpu-integration-tests:
    needs: [pr-gate]
    if: needs.pr-gate.outputs.any_changed == 'true' && needs.pr-gate.outputs.run_integration == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: gpu_megatron
            timeout: 60
            container_image: nvcr.io/nvidia/nemo:26.08
          - example: gpu_trtllm
            timeout: 15
            container_image: nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc20
          # Covers the RoutedExperts layout (0.24+)
          - example: gpu_vllm
            timeout: 15
            container_image: docker.io/vllm/vllm-openai:v0.30.0
          # Covers the legacy FusedMoE / SharedFusedMoE registration branches (vLLM < 0.24)
          - example: gpu_vllm
            timeout: 15
            container_image: docker.io/vllm/vllm-openai:v0.20.0
    uses: ./.github/workflows/_gpu_tests_runner.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      example: ${{ matrix.example }}
      timeout_minutes: ${{ matrix.timeout }}
      container_image: ${{ matrix.container_image }}
      runner: >-
        ${{ (startsWith(github.ref, 'refs/heads/pull-request/') || github.event_name == 'merge_group') &&
        'linux-amd64-gpu-rtxpro6000-latest-1' || 'linux-amd64-gpu-rtxpro6000-latest-2' }}

  gpu-pr-required-check:
    # Run even if gpu-tests is skipped
    if: >-
      ${{ (startsWith(github.ref, 'refs/heads/pull-request/') ||
      github.event_name == 'merge_group') && always() }}
    needs: [pr-gate, gpu-tests, gpu-integration-tests]
    runs-on: ubuntu-latest
    steps:
      - name: GPU integration tests are left to the merge queue
        if: >-
          ${{ needs.pr-gate.outputs.any_changed == 'true' &&
          needs.pr-gate.outputs.run_integration != 'true' }}
        run: >-
          echo "::notice::The Megatron, TensorRT-LLM and vLLM lanes run in the merge queue; add the
          run-integration-tests label and re-run this workflow to run them on this PR."
      - name: Required GPU tests did not succeed
        if: >-
          ${{ needs.pr-gate.result != 'success' || (needs.pr-gate.outputs.any_changed == 'true' &&
          (needs.gpu-tests.result != 'success' || (needs.pr-gate.outputs.run_integration == 'true' &&
          needs.gpu-integration-tests.result != 'success'))) }}
        run: exit 1
